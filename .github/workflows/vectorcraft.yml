name: build-vectorcraft-ko

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone vectorcraft at latest release tag
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/storytold/vectorcraft/releases/latest | grep -oP '"tag_name": *"\K[^"]+')
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "$TAG" https://github.com/storytold/vectorcraft

      - name: Clone craft-fonts
        run: git clone --depth 1 https://github.com/storytold/craft-fonts

      - name: Add Korean UI font (NanumGothic) to the web font list
        run: |
          cd vectorcraft
          sed -i '/^startup | Noto Sans Georgian | Regular$/a startup | NanumGothic | Regular' crates/text/web-fonts.txt
          grep -n "NanumGothic" crates/text/web-fonts.txt
          grep -c "^startup" crates/text/web-fonts.txt

      - name: Register extra Korean document fonts in craft-fonts
        run: |
          cd craft-fonts
          G="https://raw.githubusercontent.com/google/fonts/main/ofl"
          add() { # dir file family style
            mkdir -p "fonts/$1"
            curl -fsSL -o "fonts/$1/$2" "$G/$1/$2"
            [ -f "fonts/$1/OFL.txt" ] || curl -fsSL -o "fonts/$1/OFL.txt" "$G/$1/OFL.txt"
            SHA=$(sha256sum "fonts/$1/$2" | cut -d' ' -f1)
            echo "$3 | $4 | fonts/$1/$2 | Hang,Kore | OFL-1.1 | fonts/$1/OFL.txt | $SHA | $G/$1/$2" >> fonts/manifest.txt
          }
          add nanumgothic NanumGothic-Bold.ttf NanumGothic Bold
          add nanumgothic NanumGothic-ExtraBold.ttf NanumGothic ExtraBold
          add nanummyeongjo NanumMyeongjo-Regular.ttf NanumMyeongjo Regular
          add nanummyeongjo NanumMyeongjo-Bold.ttf NanumMyeongjo Bold
          add nanummyeongjo NanumMyeongjo-ExtraBold.ttf NanumMyeongjo ExtraBold
          add gothica1 GothicA1-Regular.ttf "Gothic A1" Regular
          add gothica1 GothicA1-Bold.ttf "Gothic A1" Bold
          add gothica1 GothicA1-Black.ttf "Gothic A1" Black
          add blackhansans BlackHanSans-Regular.ttf "Black Han Sans" Regular
          add dohyeon DoHyeon-Regular.ttf "Do Hyeon" Regular
          add jua Jua-Regular.ttf Jua Regular
          add gowunbatang GowunBatang-Regular.ttf "Gowun Batang" Regular
          add gowunbatang GowunBatang-Bold.ttf "Gowun Batang" Bold
          add gowundodum GowunDodum-Regular.ttf "Gowun Dodum" Regular
          add songmyung SongMyung-Regular.ttf "Song Myung" Regular
          add nanumpenscript NanumPenScript-Regular.ttf "Nanum Pen Script" Regular
          add nanumbrushscript NanumBrushScript-Regular.ttf "Nanum Brush Script" Regular
          add gaegu Gaegu-Regular.ttf Gaegu Regular
          add gaegu Gaegu-Bold.ttf Gaegu Bold
          add gamjaflower GamjaFlower-Regular.ttf "Gamja Flower" Regular
          add eastseadokdo EastSeaDokdo-Regular.ttf "East Sea Dokdo" Regular
          tail -22 fonts/manifest.txt

      - name: Add the fonts to the web fetch list
        run: |
          cd vectorcraft
          cat >> crates/text/web-fonts.txt << 'LIST'
background | NanumGothic | Bold
background | NanumGothic | ExtraBold
background | NanumMyeongjo | Regular
background | NanumMyeongjo | Bold
background | NanumMyeongjo | ExtraBold
background | Gothic A1 | Regular
background | Gothic A1 | Bold
background | Gothic A1 | Black
background | Black Han Sans | Regular
background | Do Hyeon | Regular
background | Jua | Regular
background | Gowun Batang | Regular
background | Gowun Batang | Bold
background | Gowun Dodum | Regular
background | Song Myung | Regular
background | Nanum Pen Script | Regular
background | Nanum Brush Script | Regular
background | Gaegu | Regular
background | Gaegu | Bold
background | Gamja Flower | Regular
background | East Sea Dokdo | Regular
LIST
          grep -c "^background" crates/text/web-fonts.txt

      - name: Rust toolchain (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vectorcraft

      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf - -C "$HOME/.cargo/bin"
          trunk --version

      - name: Build web (with craft-fonts)
        run: |
          cd vectorcraft/apps/vectorcraft-web
          CRAFT_FONTS_DIR="$GITHUB_WORKSPACE/craft-fonts" trunk build --release
          ls -la ../../dist/web | head
          test -d ../../dist/web/fonts && du -sh ../../dist/web/fonts

      - name: Zip
        run: |
          cd vectorcraft/dist/web
          zip -qr "$GITHUB_WORKSPACE/vectorcraft-web-ko-$TAG.zip" .
          ls -la "$GITHUB_WORKSPACE/vectorcraft-web-ko-$TAG.zip"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "vectorcraft-ko-$TAG" --repo "$GITHUB_REPOSITORY" \
            -t "VectorCraft web KO $TAG" \
            -n "VectorCraft $TAG web build + NanumGothic startup font (Korean UI). Upstream: storytold/vectorcraft, MIT OR Apache-2.0. Font: SIL OFL 1.1." \
            "vectorcraft-web-ko-$TAG.zip" || \
          gh release upload "vectorcraft-ko-$TAG" --repo "$GITHUB_REPOSITORY" --clobber "vectorcraft-web-ko-$TAG.zip"
